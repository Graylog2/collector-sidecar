name: "Build"

on:
  push:
    branches:
      - "master"
  pull_request:
    types:
      - "opened"
      - "reopened"
      - "synchronize"
  workflow_dispatch:

defaults:
  run:
    shell: "bash"

permissions:
  contents: "read"

jobs:
  build:
    runs-on: "ubuntu-latest"

    steps:
      - name: "Checkout repository"
        uses: "actions/checkout@v7"
        with:
          persist-credentials: false

      - name: "Setup tools"
        run: |
          sudo gem install fpm-cookery

      - name: "Setup Go environment"
        uses: "actions/setup-go@v7"
        with:
          go-version-file: "go.mod"
          check-latest: true

      - name: "Vendor dependencies"
        run: |
          go version
          go mod vendor

      - name: "Build binaries"
        run: "make build-all"

      - name: "Run tests"
        run: "make test"

      - name: "Build packages"
        run: "make package-all"
